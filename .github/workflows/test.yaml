name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw test

  live-index-compatibility:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check published Javadoc pages and indexes
        env:
          JDOC_LIVE_TEST: 'true'
        run: ./mvnw -Dtest=JavadocLiveTest,SearchIndexLiveTest test
